<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>確サポ</title>
  <meta name="description" content="領収書を撮るだけで、確定申告まで迷わない。個人事業主向けの領収書・確定申告サポート。">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="確サポ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&amp;text=%E7%A2%BA%E5%AE%9A%E7%94%B3%E5%91%8A%E3%82%B5%E3%83%9D%E3%83%BC%E3%83%88&amp;display=swap">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app"></div>

  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
  <input id="gallery-input" type="file" accept="image/*" multiple hidden>
  <input id="import-input" type="file" accept="application/json,.json" hidden>

  <div id="overlay" class="overlay" hidden role="status" aria-live="polite">
    <div class="overlay-box">
      <div class="spinner" aria-hidden="true"></div>
      <div class="overlay-label">読み取っています</div>
      <div class="overlay-bar"><div></div></div>
      <div class="overlay-note">画像はこのスマホの中で処理しています</div>
    </div>
  </div>
  <div id="viewer" class="viewer" hidden><img alt="領収書の画像"><button type="button" class="viewer-close" data-action="close-viewer">閉じる</button></div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <noscript>確サポを使うには JavaScript を有効にしてください。</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
